<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEGA Dashboard (BLE)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* ============================================================
            GLOBAL DARK CYBER STYLES
           ============================================================ */
        :root {
            --bg-main: #0a0c10;
            --bg-card: #131722;
            --accent-orange: #ff7a00;
            --accent-blue: #00f0ff;
            --accent-green: #00ff9d;
            --accent-red: #ff5555;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-color: #242b3d;
        }

        html, body {
            height: 100%;
            background-color: #0a0c10 !important;
            color: #f0f4f8 !important;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: inherit;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ============================================================
            HEADER & TITLE
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-text {
            font-size: 38px;
            font-weight: 900;
            color: var(--accent-orange);
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 122, 0, 0.6);
        }

        .title-text {
            font-size: 38px;
            font-weight: 300;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        /* ============================================================
            UI BUTTONS & BADGES
           ============================================================ */
        .button-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        button {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            outline: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: #1c2230;
            color: var(--text-main);
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Line ボタンの特別色 */
        .btn-line {
            background: #3d2d1d;
            border-color: #6e4e2d;
            color: var(--accent-orange);
        }
        .btn-line:hover {
            border-color: var(--accent-orange);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 122, 0, 0.4);
        }

        /* BLE Status Badge */
        .btn-ble {
            background: #1a1010;
            border: 1px solid #5a2020;
            color: var(--accent-red);
            letter-spacing: 1px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .btn-ble::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        .btn-ble.connected {
            background: #101c18;
            border: 1px solid #1a5c40;
            color: var(--accent-green);
        }

        .btn-ble.connected::before {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Toggle Switch */
        .switch-container {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            margin-left: 10px;
        }

        .switch-track {
            width: 44px;
            height: 22px;
            border-radius: 999px;
            position: relative;
            background: #242b3d;
            border: 1px solid #3d4966;
            transition: background 0.2s;
        }

        .switch-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            background: var(--text-muted);
            transition: transform 0.2s, background 0.2s;
        }

        .switch-container.active .switch-track {
            background: var(--accent-green);
            border-color: #42ffaf;
        }

        .switch-container.active .switch-thumb {
            transform: translateX(22px);
            background: #fff;
            box-shadow: 0 0 8px #fff;
        }

        /* ============================================================
            TELEMETRY DATA TABLE
           ============================================================ */
        .data-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
        }

        .table-container {
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        table thead {
            background: #181e2e;
            color: var(--text-muted);
            font-weight: bold;
        }

        table th, table td {
            padding: 12px 15px;
            text-align: left;
        }

        table td {
            font-family: monospace;
            color: #d0d9e0;
            border-bottom: 1px solid var(--border-color);
        }

        /* ============================================================
            SYSTEM CONSOLE LOG
           ============================================================ */
        .console-info {
            background: #07090d;
            border: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 12px;
            color: #52b7ff;
            padding: 15px;
            height: 140px;
            border-radius: 8px;
            overflow-y: auto;
            margin-top: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title-area">
                <span class="logo-text">VEGA</span>
                <span class="title-text">Dashboard</span>
            </div>
            <div class="btn-ble" id="bleStatusBadge">BLE DISCONNECTED</div>
        </div>

        <div class="button-row">
            <button id="connectBtn" onclick="connectBLEProcess()">Disconnected</button>
            <button onclick="requestLogs()">Get Logs</button>
            <button onclick="clearLogs()">Clear</button>
            <button onclick="requestStatus()">Status</button>
            
            <div class="switch-container" id="toggleSwitch" onclick="toggleSwitchMode()">
                <div class="switch-track">
                    <div class="switch-thumb"></div>
                </div>
            </div>

            <button class="btn-line" onclick="sendLineCommand()">Line</button>
        </div>

        <div class="data-section">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Log #</th>
                            <th>Timestamp (ms)</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>

        <div class="console-info" id="console"></div>
    </div>

    <script>
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

        let bleDevice = null;
        let bleCharacteristic = null;
        let isBleConnected = false;
        let logCounter = 1;

        window.addEventListener('DOMContentLoaded', () => {
            logConsole("システムレディ。接続ボタンを押してBLE通信を開始してください。");
        });

        async function connectBLEProcess() {
            if (isBleConnected) {
                disconnectBLE();
                return;
            }

            const badge = document.getElementById('bleStatusBadge');
            const connBtn = document.getElementById('connectBtn');

            try {
                logConsole("BLEデバイスの探索を開始...");
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                logConsole("デバイスに接続中...");
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', (e) => {
                    const rawData = new TextDecoder().decode(e.target.value);
                    logConsole(`Rx: ${rawData.trim()}`);
                    appendTableData(rawData);
                });

                isBleConnected = true;
                badge.innerText = "BLE ONLINE";
                badge.className = "btn-ble connected";
                connBtn.innerText = "Connected";
                logConsole("BLE通信が正常に確立しました。");

            } catch (error) {
                logConsole(`接続エラー: ${error}`);
            }
        }

        function disconnectBLE() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
            isBleConnected = false;
            document.getElementById('bleStatusBadge').innerText = "BLE DISCONNECTED";
            document.getElementById('bleStatusBadge').className = "btn-ble";
            document.getElementById('connectBtn').innerText = "Disconnected";
            logConsole("BLEデバイスを切断しました。");
        }

        function appendTableData(data) {
            const tbody = document.getElementById('table-body');
            const row = document.createElement('tr');
            const timestamp = new Date().getTime();

            row.innerHTML = `<td>#${logCounter++}</td><td>${timestamp}</td><td>${data.trim()}</td>`;
            
            if (tbody.firstChild) {
                tbody.insertBefore(row, tbody.firstChild);
            } else {
                tbody.appendChild(row);
            }
        }

        async function sendBLECommand(command) {
            if (!bleCharacteristic || !isBleConnected) {
                logConsole(`模擬送信 (未接続): ${command}`);
                return;
            }
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(command + "\n");
                await bleCharacteristic.writeValue(data);
                logConsole(`Tx: ${command}`);
            } catch (error) {
                logConsole(`送信失敗: ${error}`);
            }
        }

        function requestLogs() { sendBLECommand("GET_LOGS"); }
        function requestStatus() { sendBLECommand("REQ_STATUS"); }
        function sendLineCommand() { sendBLECommand("CMD_LINE"); }
        
        function toggleSwitchMode() {
            const sw = document.getElementById('toggleSwitch');
            sw.classList.toggle('active');
            const isActive = sw.classList.contains('active');
            sendBLECommand(`SWITCH:${isActive ? "ON" : "OFF"}`);
        }

        function clearLogs() {
            document.getElementById('table-body').innerHTML = '';
            logCounter = 1;
            logConsole("表示キャッシュをクリアしました。");
        }

        function logConsole(msg) {
            const c = document.getElementById('console');
            const d = document.createElement('div');
            d.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }
    </script>
</body>
</html>
